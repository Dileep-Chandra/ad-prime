<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buy Credits</title>

    <!-- ===== ORIGINAL profile.css (UNCHANGED) ===== -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #f2f3f7;
            color: #333;
        }

        /* Header */
        .header {
            background: #fff;
            padding: 20px 40px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 500;
        }

        .logout-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
        }

        .logout-btn img {
            width: 10px;
            height: 10px;
            margin-right: 2px;
        }

        .logout-btn p {
            display: inline;
            font-size: 14px;
            font-weight: 500;

        }

        /* Layout */
        .container {
            margin: 20px auto;
            padding: 0 15px;
            overflow-x: hidden
        }

        /* Card */
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .header-row {
            position: relative;
            display: flex;
            align-items: center;
            height: 40px;
            margin-bottom: 20px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 20px;
            background: none;
            border: none;
            padding: 30px 40px 0 10px;
        }

        .back-btn img {
            width: 13px;
            height: 11px;
        }

        .section-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 13px;
            line-height: 100%;
            letter-spacing: 4.59px;
            text-transform: uppercase;
            text-align: center;
        }

        .card-header {
            display: flex;
            align-items: center;
            background: #e9edff;
            padding: 5px 5px;
            margin-bottom: 18px;
            border-radius: 6px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 80px;
        }

        .header-img {
            width: 120px;
            height: 75px;
            object-fit: inherit;
        }


        .card-header .title {
            font-size: 20px;
            font-weight: 800;
            color: #1f2a44;
            margin: 0;
        }

        .receipt-meta {
            display: grid;
            grid-template-columns: auto auto;
            justify-content: end;
            column-gap: 22px;
            row-gap: 4px;
            font-size: 13px;
            color: #2f3a5f;
            white-space: normal;
            margin-left: 20%;
        }

        .accepted-products {
            text-align: right;
            font-size: 13px;
            font-weight: 700;
            font-weight: bold;
        }

        #merchantAmount {
            font-weight: 700;
            font-weight: bold;
        }



        .details {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 0 auto;
            padding: 10px 0;
        }

        .detail-section {
            padding: 8px 0;
        }

        .detail-section:not(:last-child) {
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 12px;
            padding-bottom: 14px;
        }

        .details .row {
            display: grid;
            grid-template-columns: 240px 1fr;
            padding: 10px 0;
            font-size: 13px;
            align-items: center;
        }

        .hash {
            word-break: break-all;
        }

        .status {
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 12px;
            width: 80px;
        }

        .success {
            background: #d4f5e2;
            color: #1b7a45;
        }


        
        /* Footer */
        .footer {
            text-align: center;
            font-size: 13px;
            padding: 20px;
            color: #777;
        }

        .timestamp {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .confirmed {
            font-size: 12px;
            padding-top: 5px;
        }
         .header-img-div {
            width: 120px;
            height: 80px;
            border-radius: 8px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header-img {   
            height: 100%;
        }
        /* ================= RESPONSIVE CSS ONLY ================= */





        /* Tablet and below */
        @media (max-width: 1024px) {
            .container {
                padding: 0 10px;
            }

            .receipt-meta {
                margin-left: 10%;
                font-size: 14px;
            }

            .details .row {
                grid-template-columns: 180px 1fr;
                font-size: 14px;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {


            /* Top header */
            .header {
                flex-direction: column;
                gap: 12px;
                padding: 15px;
                text-align: center;
            }

            .user-info {
                justify-content: center;
            }

            /* Card header */
            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-left {
                gap: 12px;
            }

            .header-img {
                width: 90px;
                height: 55px;
            }

            .card-header .title {
                font-size: 16px;
            }

            .receipt-meta {
                width: 100%;
                margin-left: 0;
                justify-content: space-between;
                grid-template-columns: 1fr 1fr;
                font-size: 14px;
            }

            .accepted-products {
                grid-column: span 2;
                text-align: left;
            }

            /* Section title */
            .section-title {
                font-size: 11px;
                letter-spacing: 3px;
                margin: 0;
            }

            .header-row {
                margin-bottom: 10px;
            }

            .back-btn {
                font-size: 11px;
                padding: 0;
            }

            /* Details rows */
            .details .row {
                grid-template-columns: 1fr;
                gap: 10px;
                margin-bottom: 10px;
                font-size: 12px;
            }

            .details .row span:first-child {
                font-size: 13px;
                color: #666;
            }

            /* Table */
            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 8px;
                white-space: nowrap;
            }

            .table-wrapper {
                overflow-x: auto;
            }

            /* Footer */
            .footer {
                font-size: 12px;
                padding: 15px;
            }

            .confirmed {
                font-size: 8px;
                padding-top: 0px;
            }

            .timestamp {
                display: flex;
                align-items: center;
                font-size: 10px;
                gap: 3px;
                flex-wrap: nowrap;
            }
        }

        /* Small mobile */
        @media (max-width: 480px) {
            .header-img {
                width: 70px;
                height: 45px;
            }

            .card {
                padding: 15px;
            }

            .card-header .title {
                font-size: 16px;
                font-weight: bold;
            }

            .receipt-meta {
                font-size: 11px;
            }

            .accepted-products {
                font-size: 11px;

            }
        }

       
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="logo-section">
            <img src="img/main-logo.png" alt="" class="logo-icon">
            <div class="logo-text">
                <h1>Ad:Prime Scan</h1>
            </div>
        </div>
        <div class="user-info">
            <span class="user-name" id="username"> </span>
            <button class="logout-btn" title="Logout">
                <img src="img/logout.png" alt="">
                <p><u>Logout</u></p>
            </button>
        </div>
    </div>

    <main class="container">

        <section class="card">
            <div class="header-row">
                <button class="back-btn">
                    <img src="img/back.png" alt=""> Back
                </button>

                <div class="section-title">TRANSACTION DETAILS</div>
            </div>

            <div class="card-header">
                <div class="header-left">
                    <div class="header-img-div">
                        <img src="img/method3.svg" class="header-img">
                    </div>

                    <h2 class="title">Buy Credits</h2>
                </div>

                <div class="receipt-meta">
                    <span id="merchantAmount"></span>
                    <span id="receiptId"></span>
                    <div class="accepted-products">
                        <strong id="acceptedProducts"></strong>
                    </div>
                </div>
            </div>

            <div class="details">
                <div class="detail-section">
                    <div class="row"><span>Transaction description</span><strong id="description"></strong></div>
                    <div class="row"><span>Transaction Hash</span><span class="hash" id="txHash"></span></div>
                    <div class="row"><span>Status</span><span class="status success" id="status"></span></div>
                    <div class="row"><span>Block</span><span id="block"></span></div>
                    <div class="row">
                        <span>Timestamp</span>
                        <div class="timestamp">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor">
                                <circle cx="8" cy="8" r="7" stroke-width="1.5" />
                                <path d="M8 4 L8 8 L11 10" stroke-width="1.5" stroke-linecap="round" />
                            </svg>
                            <span id="timestamp"></span>
                            <span>|</span>
                            <span id="timeAgo"></span>
                            <span class="confirmed" id="confirmationTime"></span>
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="row"><span>From</span><strong id="from"></strong></div>
                    <div class="row">
                        <span>To</span>
                        <div class="copy-wrapper">
                            <span id="to"></span>
                        </div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="row"><span>Credits</span><strong id="primesTransferred"></strong></div>
                    <div class="row"><span>Primes</span><strong id="transactionFee"></strong></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        Copyright © 2026 Ad:Prime Scan by Blu Vela. All Rights Reserved.
    </footer>

    <!-- ===== ORIGINAL profile.js (UNCHANGED) ===== -->
    <script>
        // ================= TRANSACTION DATA =================
        const receiptData = {
            user: "Ma2E_55MIM, Capitalist",
            merchant: " CHF 100.00 Credits",
            description: "Add Credits to User Wallet",
            txHash: "1fe2dc2363996cbb9c629d9e95627d612234b8371ad28df548e50cb85b0db10",
            status: "SUCCESS",
            block: "7703166",
            timestamp: "Dec-05-2021 08:09:05 AM +UTC | 183 days 22 hrs ago",
            from: "Ad:Prime Wallet",
            to: "Ma2E…55MIM",
            primesTransferred: "0.002342 Primes-CH",
            transactionFee: "0.002342 Primes-CH",
            timeAgo: "183 days 22 hrs ago",
            confirmed: "Confirmed within 2 secs"
        };


        // ================= BIND TRANSACTION DATA =================
        document.getElementById("username").innerText = receiptData.user;
        document.getElementById("merchantAmount").innerHTML =
            `<span>${receiptData.merchant}</span>`;

        document.getElementById("description").innerText = receiptData.description;
        document.getElementById("txHash").innerText = receiptData.txHash;
        document.getElementById("status").innerText = receiptData.status;
        document.getElementById("block").innerText = receiptData.block;
        document.getElementById("timestamp").innerText = receiptData.timestamp;
        document.getElementById("timeAgo").innerText = receiptData.timeAgo;
        document.getElementById("from").innerText = receiptData.from;
        document.getElementById("to").innerText = receiptData.to;
        document.getElementById("primesTransferred").innerText = receiptData.primesTransferred;
        document.getElementById("transactionFee").innerText = receiptData.transactionFee;


        document.getElementById("from").style.color = "#1A1A1A";
        document.getElementById("from").style.fontWeight = "400";
        document.getElementById("to").style.color = "#003EFF";

        document.getElementById("username").style.textDecoration = "underline";


        const confirmationSeconds = 2;

        document.getElementById("timestamp").textContent =
            "Dec-05-2021 08:09:05 AM +UTC";

        document.getElementById("confirmationTime").textContent =
            `Confirmed within ${confirmationSeconds} seconds`;


        function copyToValue() {
            const valueEl = document.getElementById("to");
            const text = valueEl.textContent;

            navigator.clipboard.writeText(text);

            valueEl.style.color = "#16a34a";
            setTimeout(() => {
                valueEl.style.color = "";
            }, 800);
        }

    </script>
</body>

</html>
