<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ad:Prime Scan - Login</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-page-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Login Content */
        .login-content {
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        /* Logo */
        .logo-container {
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            position: relative;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 36px;
            font-weight: 600;
            color: #fff;
            margin: 0;
            line-height: 1;
        }

        /* Login Form */
        .login-form {
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .input-group input {
            flex: 1;
            border: none;
            padding: 16px 20px;
            font-size: 14px;
            color: #333;
            font-family: 'Poppins', sans-serif;
            outline: none;
            background: #d9d9d9;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .input-group button {
            border: none;
            background: #0066ff;
            color: #fff;
            padding: 16px 40px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
        }

        .input-group button:hover {
            background: #0052cc;
        }

        /* Help Text */
        .help-text {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
            font-style: italic;
            line-height: 1.6;
            text-align: left;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Footer */
        .login-footer {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .login-footer p {
            color: #666;
            font-size: 12px;
            margin: 0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo-container {
                margin-bottom: 40px;
                flex-direction: column;
                gap: 10px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
            }

            .logo-text h1 {
                font-size: 28px;
            }

            .input-group {
                flex-direction: column;
            }

            .input-group input {
                padding: 14px 18px;
                font-size: 13px;
            }

            .input-group button {
                padding: 14px 30px;
                font-size: 13px;
            }

            .help-text {
                font-size: 13px;
                padding: 0 20px;
            }
        }

        @media (max-width: 480px) {
            .logo-icon {
                width: 50px;
                height: 50px;
            }

            .logo-text h1 {
                font-size: 24px;
            }

            .login-footer {
                bottom: 20px;
            }

            .login-footer p {
                font-size: 10px;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-page-container">
        <!-- Login Content -->
        <div class="login-content">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-icon">
                    <img src="img/main-logo.png" alt="Ad:Prime Logo">
                </div>
                <div class="logo-text">
                    <h1>Ad:Prime Scan</h1>
                </div>
            </div>

            <!-- Login Form -->
            <div class="login-form">
                <form method="post" id="loginForm">
                    <div class="input-group">
                        <input 
                            type="text" 
                            name="wallet" 
                            placeholder="Your Wallet Addres" 
                            required
                            autocomplete="off"
                        >
                        <button type="submit" name="login" value="login">
                            LOGIN
                        </button>
                    </div>
                </form>
            </div>

            <!-- Help Text -->
            <p class="help-text">
                You can find your wallet address at the top<br>
                of the Credits page in the AdPrime app.
            </p>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p>Copyright © 2026 Ad:Prime Scan by Blu Vela. All Rights Reserved.</p>
        </div>
    </div>
</body>
</html>
